# Present so that loader.efi will accept this device.
#
# FreeBSD's EFI loader calls sanity_check_currdev() before it will use a
# device, and that succeeds only if one of these exists:
#
#     /boot/defaults/loader.conf
#     /boot/kernel/kernel        (PATH_KERNEL)
#     a bootable token           (PATH_BOOTABLE_TOKEN, not defined on amd64)
#
# m0n0wall has NONE of them: its kernel is /kernel.gz at the root of the
# filesystem, and loader.rc loads it explicitly. The BIOS path never cared --
# cdboot chains straight to loader, which reads loader.rc. UEFI does care, and
# without this file loader.efi starts, probes every device, and gives up with
#
#     Failed to find bootable partition
#
# even though the ESP, the loader and the kernel are all present and correct.
#
# The contents are irrelevant; only the file's existence is tested. The real
# configuration is in ../loader.rc.
