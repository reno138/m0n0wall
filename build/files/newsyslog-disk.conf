# m0n0wall log rotation -- PERSISTENT logs, on the m0n0data partition.
#
# Used instead of newsyslog.conf when /var/log is on disk (datadisk.inc copies
# the right one to /var/etc/newsyslog.conf at boot). The budget is 1 GB, and
# these limits keep it even if compression were to save nothing at all:
#   live file + <count> rotated copies, each at most <size>
#   system    20 MB x 9 = 180 MB      filter  40 MB x 9 = 360 MB
#   dhcpd, vpn, portalauth, lighttpd 10 MB x 5 = 50 MB each = 200 MB
#   pflog.cap 30 MB x 6 = 180 MB      total                   920 MB
# In practice bzip2 (J) shrinks the rotated text logs roughly tenfold.
# logfilename          [owner:group]  mode count size(KB) when  flags
/var/log/system.log                   600  8     20480    *     JC
/var/log/filter.log                   600  8     40960    *     JC
/var/log/dhcpd.log                    600  4     10240    *     JC
/var/log/vpn.log                      600  4     10240    *     JC
/var/log/portalauth.log               600  4     10240    *     JC
/var/log/lighttpd.log                 600  4     10240    *     JC
# pflogd's pcap. Not compressed, so tcpdump -r reads the rotated copies
# directly. pflogd reopens the file on SIGHUP via its pidfile.
/var/log/pflog.cap			600  5     30720    *     B    /var/run/pflogd.pid 1
