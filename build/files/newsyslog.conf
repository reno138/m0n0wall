# m0n0wall log rotation.
#
# Replaces the circular ("ring buffer") logs the old build provided by
# patching syslogd.c and pairing it with clog(8). That patch had to be
# forward-ported to every new FreeBSD release, and clog is not in base.
#
# newsyslog(8) is in base and bounds the files by size, which is what the ring
# buffer was for. The webGUI reads them with tail(1).
#
# logfilename          [owner:group]  mode count size(KB) when  flags
/var/log/system.log                   600  3     256      *     JC
/var/log/filter.log                   600  3     512      *     JC
/var/log/dhcpd.log                    600  2     128      *     JC
/var/log/vpn.log                      600  2     128      *     JC
/var/log/portalauth.log               600  2     128      *     JC
/var/log/lighttpd.log                 600  2     128      *     JC
