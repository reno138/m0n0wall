# m0n0wall syslog.conf -- the default when remote logging is not configured
# (system_syslogd_start() writes /var/etc/syslog.conf when it is).
#
# Plain file targets. The 2011 file in etcadditional.tgz had '%/var/log/...'
# (clog circular logs, understood only by m0n0wall's patched syslogd); stock
# FreeBSD syslogd read those as user names and dropped every message, which
# is why no log page ever showed anything. Files are created by etc/rc at
# boot and rotated by newsyslog.conf.
local0.*					/var/log/filter.log
local3.*					/var/log/vpn.log
local4.*					/var/log/portalauth.log
local7.*					/var/log/dhcpd.log
*.notice;kern.debug;lpr.info;mail.crit;news.err;local0.none;local3.none;local4.none;local7.none	/var/log/system.log
security.*					/var/log/system.log
auth.info;authpriv.info;daemon.info		/var/log/system.log
*.emerg						*
