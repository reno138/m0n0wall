; m0n0wall PHP configuration.
;
; LOCATION MATTERS. PHP 4 was built from source with a default prefix and read
; /usr/local/lib/php.ini, which is where the old build installed this. The
; FreeBSD php84 package reads /usr/local/etc/php.ini. Putting it in the old
; place means PHP starts with NO configuration at all, the include_path below
; is never applied, and rc.bootup dies on its first require_once:
;
;     Failed opening required 'globals.inc'
;     (include_path='.:/usr/local/share/pear')
;
; which looks like a missing file rather than a missing php.ini.

; This is the line that matters. m0n0wall's includes live in /etc/inc and its
; pages require them by bare name.
include_path = ".:/etc/inc:/usr/local/www:/usr/local/captiveportal"

; No time limit: filter_configure() and friends can take a while on a slow box
; and are not request-shaped work.
max_execution_time = 0
max_input_time = 180

register_argc_argv = Off

; Config backup restore and firmware upload both post files.
file_uploads = On
upload_tmp_dir = /ftmp
; A firmware image is the largest thing the webGUI ever receives. 16M was the
; 2015 value, when a whole m0n0wall image was 6 MB; the image is ~38 MB now
; and will grow. Must stay below the /ftmp RAM disk size in rc.firmware.
upload_max_filesize = 100M
post_max_size = 102M

; display_errors is On deliberately. With it Off, a fatal in a console script
; (rc.bootup, rc.banner, rc.initial.*) produces NO output at all -- the script
; simply exits and the menu redraws, which is indistinguishable from the menu
; option doing nothing. That cost a full debugging cycle once; don't turn it
; back off without providing another way to read /var/log/system.log.
; html_errors stays Off so webGUI errors aren't wrapped in markup mid-page.
html_errors = Off
display_errors = On
log_errors = On
error_log = /var/log/system.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; ---------------------------------------------------------------------------
; Extensions.
;
; These MUST be listed explicitly. The FreeBSD php84-* packages normally enable
; each extension with its own file in /usr/local/etc/php/ (the scan dir), but
; the image ships only this php.ini -- that directory does not exist on the
; ramdisk, so nothing there gets read and every extension stays unloaded even
; though the .so files are installed.
;
; This is not cosmetic. xml_parser_create() lives in xml.so, config.inc parses
; config.xml on startup, and EVERY m0n0wall entry point (rc.bootup, rc.banner,
; rc.initial.*, the webGUI) begins by requiring config.inc. Without xml here
; the whole system dies before it does anything -- silently, if display_errors
; is Off.
;
; extension_dir is already correct (/usr/local/lib/php/20240924, compiled in),
; so these are bare names. Built into the binary already and NOT to be listed
; here, or PHP warns "module already loaded": libxml, openssl, json, hash,
; pcre, date, random, Reflection, SPL, standard, mysqlnd.
;
; mbstring is deliberately NOT built or loaded: the codebase makes zero mb_*
; calls, and mbstring.so drags in libonig (Oniguruma). Don't add it back
; without also adding libonig to the image -- the extension is useless
; without it and fails loudly at every PHP startup.
; ---------------------------------------------------------------------------
extension=xml
extension=filter
extension=pcntl
extension=posix
extension=session
extension=sockets
extension=zlib

; REMOVED for PHP 8:
;   magic_quotes_gpc, magic_quotes_runtime -- gone since PHP 5.4. Leaving them
;   in is not merely useless: an unknown directive is a startup warning on
;   every single PHP invocation, and the webGUI invokes PHP per request.
