; m0n0wall PHP configuration.
;
; LOCATION MATTERS. PHP 4 was built from source with a default prefix and read
; /usr/local/lib/php.ini, which is where the old build installed this. The
; FreeBSD php84 package reads /usr/local/etc/php.ini. Putting it in the old
; place means PHP starts with NO configuration at all, the include_path below
; is never applied, and rc.bootup dies on its first require_once:
;
;     Failed opening required 'globals.inc'
;     (include_path='.:/usr/local/share/pear')
;
; which looks like a missing file rather than a missing php.ini.

; This is the line that matters. m0n0wall's includes live in /etc/inc and its
; pages require them by bare name.
include_path = ".:/etc/inc:/usr/local/www:/usr/local/captiveportal"

; No time limit: filter_configure() and friends can take a while on a slow box
; and are not request-shaped work.
max_execution_time = 0
max_input_time = 180

register_argc_argv = Off

; Config backup restore and firmware upload both post files.
file_uploads = On
upload_tmp_dir = /ftmp
upload_max_filesize = 16M
post_max_size = 18M

; Errors go to the log, not into the middle of a page's HTML.
html_errors = Off
display_errors = Off
log_errors = On
error_log = /var/log/system.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; REMOVED for PHP 8:
;   magic_quotes_gpc, magic_quotes_runtime -- gone since PHP 5.4. Leaving them
;   in is not merely useless: an unknown directive is a startup warning on
;   every single PHP invocation, and the webGUI invokes PHP per request.
